# Lift — XcodeGen project definition
#
# Regenerate Lift.xcodeproj with:  xcodegen generate   (or: make project)
# The .xcodeproj is a build artifact — it is gitignored. This file is the
# source of truth for targets, entitlements, capabilities and Info.plist keys.
#
# Replace com.dugcanlift throughout, and set DEVELOPMENT_TEAM to your 10-char
# Team ID from developer.apple.com → Membership.

name: Lift

options:
  bundleIdPrefix: com.dugcanlift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "QG57FJM5C8"
    CODE_SIGN_STYLE: Automatic
    # The one version for everything this project ships: the app, its
    # widgets and its watch app. App Store validation rejects an embedded
    # watch app or extension whose CFBundleShortVersionString differs from
    # the app's, so every target's Info.plist reads these two settings rather
    # than carrying a literal. "1.0" is what the app has always reported:
    # this said "1.0.0" while XcodeGen wrote a literal "1.0" into
    # Lift-Info.plist, so the setting reached nothing.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # SwiftData @Model classes are not Sendable. `complete` buries real errors
    # under concurrency warnings during scaffolding — tighten once it builds.
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # iPhone and iPad. Layout adapts to the width a window actually has
    # (Sources/App/AdaptiveLayout.swift), so an iPad in Split View at phone
    # width gets the phone's layout.
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  # Pinned to an exact tag, not a range: a change here reaches two shipped
  # apps at once, and `@Model` types are shared, so a property change in the
  # package is a schema change for both. Upgrading is a deliberate edit to
  # this line, never something that happens on a `swift package update`.
  LiftKit:
    url: https://github.com/dougray/dugcanlift-kit
    exactVersion: 1.9.0
  # The watch app's own domain package, in this repo (Watch/LiftWatchKit).
  # Its package is named LiftWatchKit, not LiftKit, so Xcode does not take it
  # for a local override of dugcanlift-kit above, whose package is also named
  # LiftKit. Its product and module are still called LiftKit.
  LiftWatchKit:
    path: Watch/LiftWatchKit

targets:

  # ---------------------------------------------------------------- app
  Lift:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared      # compiled into BOTH targets
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: LiftKit
        product: LiftCore
      - package: LiftKit
        product: LiftReference
      # The WatchConnectivity wire types, the same definitions the watch app
      # compiles. Only this product: none of the watch's domain comes along.
      - package: LiftWatchKit
        product: LiftSync
      - target: LiftWidgets
        embed: true
      # The watch app ships inside this one, under Lift.app/Watch. Being
      # embedded is what makes WCSession treat the two as peers
      # (isWatchAppInstalled on this side, isCompanionAppInstalled on that).
      - target: LiftWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.lift
        # What `make device-build` signs this target with on the free
        # Personal Team: Config/Lift.entitlements without Associated Domains,
        # which a free team cannot sign. See FREE_ENTITLEMENTS in the Makefile.
        # A target that leaves this unset keeps its own entitlements there,
        # which is the point: the widgets and the watch app need nothing a
        # free team refuses, and must not be signed with this app's.
        FREE_TEAM_ENTITLEMENTS: Config/Lift-free.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Config/Lift.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dugcanlift.lift
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.associated-domains:
          - applinks:www.dugcanlift.com
    info:
      path: Config/Lift-Info.plist
      properties:
        # An empty UILaunchScreen is what tells iOS this app is built for
        # modern screens. Without the key, iOS runs it in compatibility mode
        # -- letterboxed, with black bands above and below, using neither the
        # full height of the display nor the safe areas around the notch.
        #
        # INFOPLIST_KEY_UILaunchScreen_Generation: YES was already set in
        # `settings` and did nothing: that build setting only applies when
        # Xcode generates the Info.plist, and this target supplies its own.
        UILaunchScreen: {}
        CFBundleDisplayName: Lift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

        # Declared rather than left to the default, because iPad multitasking
        # (Split View, Slide Over, Stage Manager) requires all four iPad
        # orientations, and App Store validation rejects an iPad build that
        # neither lists them nor sets UIRequiresFullScreen. The iPhone list is
        # what the app already did with no key: every orientation but
        # upside down.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

        # The app uses only standard HTTPS (URLSession, fetching a recipe page
        # the person pastes), which is exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false

        # HealthKit — both strings are required or the app is rejected. Each
        # must say exactly what HealthKitManager requests: App Review rejects
        # a purpose string that claims more (or less) than the code does.
        # Reads: body weight (Settings > Apple Health) and step count (Home,
        # Send to Coach). Writes: strength workouts, and runs, walks and hikes
        # with their route and distance.
        NSHealthShareUsageDescription: >-
          Lift reads your body weight and step count from Health to show your
          latest weight and your daily steps.
        NSHealthUpdateUsageDescription: >-
          Lift saves your strength workouts, and your runs, walks and hikes
          with their route and distance, to Health.

        # No camera usage string: nothing in the app uses the camera.

        # When In Use only. A recording is always started from the open
        # recording screen, and a session started in the foreground keeps
        # receiving updates when the phone locks because LocationTracker sets
        # allowsBackgroundLocationUpdates under the `location` background mode
        # below. Lift never needs location when a recording is not running,
        # so it does not ask for Always.
        NSLocationWhenInUseUsageDescription: >-
          Lift uses your location to record the route of a run, walk or hike
          you start, including while your screen is locked until you finish it.

        # Background refresh for HealthKit sync (BGTaskScheduler), plus
        # location updates so a recording carries on while the phone is locked
        # (LocationTracker).
        # Identifiers MUST match the strings passed to BGTaskScheduler.register.
        UIBackgroundModes:
          - processing
          - location
        BGTaskSchedulerPermittedIdentifiers:
          - com.dugcanlift.lift.healthsync

  # ------------------------------------------------------------- widgets
  LiftWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
      - path: Sources/Shared      # same models, second compilation
    dependencies:
      - package: LiftKit
        product: LiftCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.lift.widgets
    entitlements:
      path: Config/LiftWidgets.entitlements
      properties:
        # Identical group to the app — this is what grants the widget
        # process access to the SwiftData store.
        com.apple.security.application-groups:
          - group.com.dugcanlift.lift
    info:
      path: Config/LiftWidgets-Info.plist
      properties:
        CFBundleDisplayName: Lift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # --------------------------------------------------------------- watch
  # LIFT for Apple Watch, this app's companion (Watch/). A single-target
  # watchOS app (Xcode 14+); the legacy application.watchapp2 pair is not
  # accepted by current Xcode.
  #
  # com.dugcanlift.lift.watchkitapp, a child of this app's id, with
  # WKCompanionAppBundleIdentifier naming this app. It was a WKWatchOnly app,
  # com.dugcanlift.watch, in dugcanlift-lift-watch until 2026-09; a watch-only
  # app is not an iPhone app's WCSession peer, so nothing either side sent
  # ever arrived. WKRunsIndependentlyOfCompanionApp keeps it installable and
  # usable with no iPhone nearby: it logs food and records runs on its own.
  #
  # No MARKETING_VERSION or CURRENT_PROJECT_VERSION here: it inherits the
  # project's, because an embedded watch app whose version differs from its
  # container's fails App Store validation.
  LiftWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/LiftWatch
    dependencies:
      - package: LiftWatchKit
        product: LiftKit
      - package: LiftWatchKit
        product: LiftSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.lift.watchkitapp
        # The product is LIFT.app, not LiftWatch.app: the scheme and the
        # bundle name differ, which is worth knowing before hand-writing an
        # install path (Lift.app/Watch/LIFT.app).
        PRODUCT_NAME: LIFT
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        # Embedded in Lift.app; it is archived as part of that, never alone.
        SKIP_INSTALL: YES
    # A real generated Info.plist (not GENERATE_INFOPLIST_FILE: YES +
    # INFOPLIST_KEY_* settings) because the background-mode keys need array
    # values, which the INFOPLIST_KEY_* scalar mechanism can't express.
    #
    # Two SEPARATE background-mode declarations are required, and this was
    # found by launching the app and tapping Start Run in the Watch Simulator
    # (a real crash, not a static-analysis guess). The WKBackgroundModes-only
    # version still crashed at runtime:
    #   *** Terminating app due to uncaught exception
    #   'NSInternalInconsistencyException', reason: 'Invalid parameter
    #   not satisfying: !stayUp || CLClientIsBackgroundable(...)'
    # in OutdoorActivityRecorder.start(type:), at
    # `locationManager.allowsBackgroundLocationUpdates = true`.
    # CLLocationManager.h says so in its prose: "With UIBackgroundModes set to
    # include 'location' in Info.plist, you must also set this property to
    # YES... Setting this property to YES when UIBackgroundModes does not
    # include 'location' is a fatal error." The key CoreLocation checks is
    # UIBackgroundModes, the iOS-style key, not WKBackgroundModes.
    #   - UIBackgroundModes: [location] -- so allowsBackgroundLocationUpdates
    #     is not a fatal error (OutdoorActivityRecorder.swift).
    #   - WKBackgroundModes: [location, workout-processing] -- separately
    #     required for HKWorkoutSession's background runtime, which is what
    #     keeps GPS alive while the wrist drops.
    info:
      path: Config/LiftWatch-Info.plist
      properties:
        WKApplication: YES
        WKCompanionAppBundleIdentifier: com.dugcanlift.lift
        WKRunsIndependentlyOfCompanionApp: YES
        CFBundleDisplayName: LIFT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Standard HTTPS only, like the app: the watch makes no network
        # request of its own at all.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - location
        WKBackgroundModes:
          - location
          - workout-processing
        # HealthKit -- both strings are required or the app is rejected, and
        # HealthKit authorization is per bundle id, so the move to
        # com.dugcanlift.lift.watchkitapp asks again on first launch.
        # HKWorkoutSession itself requires the capability and these strings,
        # and requesting share authorization for the workout type is how the
        # system grants a session permission to run.
        NSHealthShareUsageDescription: >-
          LIFT uses HealthKit to run a workout session, which keeps GPS
          active while recording a run or hike, and reads your heart rate
          while you lift so the app can show it and record it with the
          workout.
        NSHealthUpdateUsageDescription: >-
          LIFT saves the runs and hikes you record, and the workouts you
          lift, to the Health app.
        # CLLocationManager requires this key on watchOS too. There is no
        # requestWhenInUseAuthorization on watchOS; the system asks on first
        # use of a location API, driven off this key.
        NSLocationWhenInUseUsageDescription: >-
          LIFT uses your location to record the route of a run or hike.
    # HealthKit only: WatchConnectivity needs no entitlement, and the watch
    # shares no App Group with the phone (they talk over WCSession, never a
    # shared container). Nothing here a free Personal Team cannot sign.
    entitlements:
      path: Config/LiftWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  # --------------------------------------------------------------- tests
  LiftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # splits.json is checked against the shipped exercise database, so the
      # test bundle needs the same copy the app ships rather than a fixture.
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: Lift
      - package: LiftKit
        product: LiftCore
      - package: LiftKit
        product: LiftReference
      - package: LiftWatchKit
        product: LiftSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.lift.tests
        # Without this the test bundle has no Info.plist and code signing
        # fails, so `make test` never gets as far as running anything.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lift:
    build:
      targets:
        Lift: all
        LiftWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LiftTests
    archive:
      config: Release

  # The watch app on its own, for building and running it on a watch
  # simulator without the phone (make watch, make watch-run). Its domain logic
  # is tested by `swift test` in Watch/LiftWatchKit, which make test runs; the
  # app target itself has no test bundle.
  LiftWatch:
    build:
      targets:
        LiftWatch: all
    run:
      config: Debug
    archive:
      config: Release
