# Lift — XcodeGen project definition
#
# Regenerate Lift.xcodeproj with:  xcodegen generate   (or: make project)
# The .xcodeproj is a build artifact — it is gitignored. This file is the
# source of truth for targets, entitlements, capabilities and Info.plist keys.
#
# Replace com.dugcanlift throughout, and set DEVELOPMENT_TEAM to your 10-char
# Team ID from developer.apple.com → Membership.

name: Lift

options:
  bundleIdPrefix: com.dugcanlift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "QG57FJM5C8"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # SwiftData @Model classes are not Sendable. `complete` buries real errors
    # under concurrency warnings during scaffolding — tighten once it builds.
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # iPhone and iPad. Layout adapts to the width a window actually has
    # (Sources/App/AdaptiveLayout.swift), so an iPad in Split View at phone
    # width gets the phone's layout.
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  # Pinned to an exact tag, not a range: a change here reaches two shipped
  # apps at once, and `@Model` types are shared, so a property change in the
  # package is a schema change for both. Upgrading is a deliberate edit to
  # this line, never something that happens on a `swift package update`.
  LiftKit:
    url: https://github.com/dougray/dugcanlift-kit
    exactVersion: 1.10.0

targets:

  # ---------------------------------------------------------------- app
  Lift:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared      # compiled into BOTH targets
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: LiftKit
        product: LiftCore
      - package: LiftKit
        product: LiftReference
      - target: LiftWidgets
        embed: true
      # Embedded in Lift.app/PlugIns. See the LiftShare target below for why
      # a share extension exists at all.
      - target: LiftShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.lift
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Config/Lift.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dugcanlift.lift
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Kept for the day this is signed by a paid team. A free Apple
        # Personal Team cannot sign it at all, which is why `make device-build`
        # swaps in Config/Lift-free.entitlements and why a coach's plan link
        # also reaches LIFT three ways that need no entitlement: the
        # dugcanliftlift:// scheme below, Paste a Plan Link, and the LiftShare
        # extension.
        com.apple.developer.associated-domains:
          - applinks:www.dugcanlift.com
    info:
      path: Config/Lift-Info.plist
      properties:
        # An empty UILaunchScreen is what tells iOS this app is built for
        # modern screens. Without the key, iOS runs it in compatibility mode
        # -- letterboxed, with black bands above and below, using neither the
        # full height of the display nor the safe areas around the notch.
        #
        # INFOPLIST_KEY_UILaunchScreen_Generation: YES was already set in
        # `settings` and did nothing: that build setting only applies when
        # Xcode generates the Info.plist, and this target supplies its own.
        UILaunchScreen: {}
        CFBundleDisplayName: Lift

        # Declared rather than left to the default, because iPad multitasking
        # (Split View, Slide Over, Stage Manager) requires all four iPad
        # orientations, and App Store validation rejects an iPad build that
        # neither lists them nor sets UIRequiresFullScreen. The iPhone list is
        # what the app already did with no key: every orientation but
        # upside down.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

        # dugcanliftlift://plan#1z... opens LIFT and shows a coach's plan, the
        # same as Paste a Plan Link (LiftApp.onOpenURL -> PlanLinkIntake.open).
        # A custom scheme needs no entitlement, so it works on a free team
        # where Universal Links do not. Deliberately not `dugcanliftcoach`,
        # which is Coach iOS's scheme: a scheme claimed by two apps on one
        # phone goes to whichever iOS picks.
        CFBundleURLTypes:
          - CFBundleURLName: com.dugcanlift.lift.plan
            CFBundleURLSchemes:
              - dugcanliftlift

        # The app uses only standard HTTPS (URLSession, fetching a recipe page
        # the person pastes), which is exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false

        # HealthKit — both strings are required or the app is rejected. Each
        # must say exactly what HealthKitManager requests: App Review rejects
        # a purpose string that claims more (or less) than the code does.
        # Reads: body weight (Settings > Apple Health) and step count (Home,
        # Send to Coach). Writes: strength workouts, and runs, walks and hikes
        # with their route and distance.
        NSHealthShareUsageDescription: >-
          Lift reads your body weight and step count from Health to show your
          latest weight and your daily steps.
        NSHealthUpdateUsageDescription: >-
          Lift saves your strength workouts, and your runs, walks and hikes
          with their route and distance, to Health.

        # No camera usage string: nothing in the app uses the camera.

        # When In Use only. A recording is always started from the open
        # recording screen, and a session started in the foreground keeps
        # receiving updates when the phone locks because LocationTracker sets
        # allowsBackgroundLocationUpdates under the `location` background mode
        # below. Lift never needs location when a recording is not running,
        # so it does not ask for Always.
        NSLocationWhenInUseUsageDescription: >-
          Lift uses your location to record the route of a run, walk or hike
          you start, including while your screen is locked until you finish it.

        # Background refresh for HealthKit sync (BGTaskScheduler), plus
        # location updates so a recording carries on while the phone is locked
        # (LocationTracker).
        # Identifiers MUST match the strings passed to BGTaskScheduler.register.
        UIBackgroundModes:
          - processing
          - location
        BGTaskSchedulerPermittedIdentifiers:
          - com.dugcanlift.lift.healthsync

  # ------------------------------------------------------------- widgets
  LiftWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
      - path: Sources/Shared      # same models, second compilation
    dependencies:
      - package: LiftKit
        product: LiftCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.lift.widgets
    entitlements:
      path: Config/LiftWidgets.entitlements
      properties:
        # Identical group to the app — this is what grants the widget
        # process access to the SwiftData store.
        com.apple.security.application-groups:
          - group.com.dugcanlift.lift
    info:
      path: Config/LiftWidgets-Info.plist
      properties:
        CFBundleDisplayName: Lift
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ------------------------------------------------------ share extension
  # "LIFT" in the share sheet for a coach's plan link shared from Safari,
  # Messages, Mail or Notes. It decodes the link to say what plan it is, then
  # queues the fragment in the App Group for the app to open on its next
  # foreground -- see PendingPlanLinks for why it does not open the app, and
  # why it never writes a routine itself.
  #
  # A second extension is a second App ID to register, which a free Personal
  # Team rations (ten new ids per seven days). Worth it: without it, and
  # without Associated Domains, a plan link tapped in Messages does nothing at
  # all on a free-team build.
  LiftShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/ShareExtension
      # Only what the extension needs from Shared: no SwiftData, no views, no
      # models. Listing the three files rather than the folder is what keeps
      # that true -- a new file in Sources/Shared does not silently join a
      # share sheet with a tight memory limit.
      - path: Sources/Shared/PlanLinkExtractor.swift
      - path: Sources/Shared/PlanLinkIntake.swift
      - path: Sources/Shared/PendingPlanLinks.swift
    dependencies:
      # LiftCore only. LiftReference's GRDB and its reference databases have
      # no business in a share sheet.
      - package: LiftKit
        product: LiftCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.lift.share
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: Config/LiftShare.entitlements
      properties:
        # The app's existing group -- the same one the store and the widget
        # use, so this adds no new capability, only a new bundle id.
        com.apple.security.application-groups:
          - group.com.dugcanlift.lift
    info:
      path: Config/LiftShare-Info.plist
      properties:
        CFBundleDisplayName: LIFT
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # A web URL (Safari, Messages' link previews) or text (Notes, Mail,
            # a message body) -- a plan link can arrive as either. Text means
            # LIFT is offered for any text; the extension says plainly when it
            # isn't a plan link.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  # --------------------------------------------------------------- tests
  LiftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # splits.json is checked against the shipped exercise database, so the
      # test bundle needs the same copy the app ships rather than a fixture.
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: Lift
      - package: LiftKit
        product: LiftCore
      - package: LiftKit
        product: LiftReference
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.lift.tests
        # Without this the test bundle has no Info.plist and code signing
        # fails, so `make test` never gets as far as running anything.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lift:
    build:
      targets:
        Lift: all
        LiftWidgets: all
        LiftShare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LiftTests
    archive:
      config: Release
