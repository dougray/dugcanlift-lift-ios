# Lift — XcodeGen project definition
#
# Regenerate Lift.xcodeproj with:  xcodegen generate   (or: make project)
# The .xcodeproj is a build artifact — it is gitignored. This file is the
# source of truth for targets, entitlements, capabilities and Info.plist keys.
#
# Replace com.dugcanlift throughout, and set DEVELOPMENT_TEAM to your 10-char
# Team ID from developer.apple.com → Membership.

name: Lift

options:
  bundleIdPrefix: com.dugcanlift
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # SwiftData @Model classes are not Sendable. `complete` buries real errors
    # under concurrency warnings during scaffolding — tighten once it builds.
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"

targets:

  # ---------------------------------------------------------------- app
  Lift:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared      # compiled into BOTH targets
      - path: Sources/Reference   # app only — widgets never open SQLite
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: GRDB
      - target: LiftWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.lift
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Config/Lift.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dugcanlift.lift
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Config/Lift-Info.plist
      properties:
        CFBundleDisplayName: Lift
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

        # HealthKit — both strings are required or the app is rejected
        NSHealthShareUsageDescription: >-
          Lift reads your workouts, body measurements, and step count so your
          training history stays in sync with the Health app.
        NSHealthUpdateUsageDescription: >-
          Lift saves the workouts and meals you log to the Health app.

        NSCameraUsageDescription: >-
          Lift uses the camera to scan barcodes when you log food.

        # Background refresh for HealthKit sync (BGTaskScheduler).
        # Identifiers MUST match the strings passed to BGTaskScheduler.register.
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.dugcanlift.lift.healthsync

  # ------------------------------------------------------------- widgets
  LiftWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
      - path: Sources/Shared      # same models, second compilation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.lift.widgets
    entitlements:
      path: Config/LiftWidgets.entitlements
      properties:
        # Identical group to the app — this is what grants the widget
        # process access to the SwiftData store.
        com.apple.security.application-groups:
          - group.com.dugcanlift.lift
    info:
      path: Config/LiftWidgets-Info.plist
      properties:
        CFBundleDisplayName: Lift
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # --------------------------------------------------------------- tests
  LiftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Lift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.lift.tests

schemes:
  Lift:
    build:
      targets:
        Lift: all
        LiftWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LiftTests
    archive:
      config: Release
