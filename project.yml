name: LiftWatch
options:
  bundleIdPrefix: com.dugcanlift
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  LiftKit:
    path: LiftKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "QG57FJM5C8"
    CODE_SIGN_STYLE: Automatic

targets:
  LiftWatch:
    # Single-target watchOS app (Xcode 14+). The legacy paired
    # `application.watchapp2` type is not accepted by current Xcode.
    type: application
    platform: watchOS
    sources:
      - path: LiftWatch
    dependencies:
      - package: LiftKit
        product: LiftKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dugcanlift.watch
        PRODUCT_NAME: LIFT
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: NO
    # A real generated Info.plist (not GENERATE_INFOPLIST_FILE: YES +
    # INFOPLIST_KEY_* settings) because WKBackgroundModes needs an array
    # value, which the INFOPLIST_KEY_* scalar mechanism can't express.
    #
    # WKBackgroundModes is required for two independent reasons, both
    # confirmed against the installed watchOS SDK during final review:
    #   - `location`: CLLocationManager.h states verbatim that setting
    #     allowsBackgroundLocationUpdates = true (OutdoorActivityRecorder.swift)
    #     without this background mode declared is a fatal error at runtime.
    #   - `workout-processing`: HKWorkoutSession's background-runtime grant
    #     (the whole premise behind skipping a foreground-service equivalent —
    #     GPS staying alive while the wrist drops) depends on this being
    #     declared; confirmed via WatchKit.tbd symbol inspection.
    info:
      path: Config/LiftWatch-Info.plist
      properties:
        WKApplication: YES
        WKWatchOnly: YES
        CFBundleDisplayName: LIFT
        WKBackgroundModes:
          - location
          - workout-processing
        # HealthKit — both strings are required or the app is rejected. The
        # watch never reads Health data today, but HKWorkoutSession itself
        # requires the HealthKit capability + these usage strings to be
        # present, and requesting share authorization for the workout type
        # is how the system grants a session permission to run.
        NSHealthShareUsageDescription: >-
          LIFT uses HealthKit to run a workout session, which keeps GPS
          active while recording a run or hike.
        NSHealthUpdateUsageDescription: >-
          LIFT saves the runs and hikes you record to the Health app.
        # CLLocationManager itself requires this key on watchOS too: there is
        # no requestWhenInUseAuthorization/requestAlwaysAuthorization on
        # watchOS (confirmed absent from CLLocationManager.h for this
        # platform) — the system presents the location prompt automatically
        # on first use of a location API, driven off this Info.plist key.
        NSLocationWhenInUseUsageDescription: >-
          LIFT uses your location to record the route of a run or hike.
    entitlements:
      path: Config/LiftWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
